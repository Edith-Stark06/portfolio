<style>
        /* Extreme Cinematic Film Grain */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* Heavy CRT Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            opacity: 0.4;
        }

        /* Blinking Cursor */
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Glitch / Decrypt Effect styles handled via JS */
        
        /* Ensure viewport lock */

<script>
        // System Time Update
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            document.getElementById('sys-time').textContent = `TIME // ${h}:${m}:${s}:${ms}`;
            requestAnimationFrame(updateTime);
        }
        updateTime();

        // Hover Decrypt Effect
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
        const decryptLinks = document.querySelectorAll('.decrypt-link');

        decryptLinks.forEach(link => {
            const textElement = link.querySelector('.decrypt-text');
            const originalText = link.dataset.value;
            let interval = null;

            link.addEventListener('mouseenter', () => {
                let iteration = 0;
                clearInterval(interval);
                
                interval = setInterval(() => {
                    textElement.innerText = originalText
                        .split("")
                        .map((letter, index) => {
                            if(index < iteration) {
                                return originalText[index];
                            }
                            return letters[Math.floor(Math.random() * letters.length)];
                        })
                        .join("");
                    
                    if(iteration >= originalText.length){
                        clearInterval(interval);
                    }
                    
                    iteration += 1 / 3;
                }, 30);
            });
            
            link.addEventListener('mouseleave', () => {
                clearInterval(interval);
                textElement.innerText = originalText;
            });
        });

        // Boot Sequence Animation
        const bootScreen = document.getElementById('boot-screen');
        const bootLog = document.getElementById('boot-log');
        const bootMessages = [
            "INITIALIZING AETHER AUTOMATION SEQUENCE...",
            "LOADING KERNEL MODULES... OK",
            "MOUNTING VIRTUAL FILE SYSTEM... OK",
            "ESTABLISHING SECURE CONNECTION...",
            "HANDSHAKE PROTOCOL: ACCEPTED",
            "DECRYPTING PAYLOAD...",
            "ACCESS GRANTED."
        ];

        let msgIndex = 0;
        function printBootMessage() {
            if (msgIndex < bootMessages.length) {
                const msg = document.createElement('div');
                msg.textContent = `> ${bootMessages[msgIndex]}`;
                bootLog.appendChild(msg);
                msgIndex++;
                setTimeout(printBootMessage, Math.random() * 200 + 100);
            } else {
                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    bootScreen.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        bootScreen.style.display = 'none';
                    }, 500);
                }, 500);
            }
        }
        
        // Start boot sequence on load
        window.onload = () => {
            setTimeout(printBootMessage, 500);
        };

    </script>
